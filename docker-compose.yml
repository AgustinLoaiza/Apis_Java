services:

  mysql:
    image: mysql:8.0
    container_name: empleados-mysql

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - empleados_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

    networks:
      - empleados-network


  rest-api:
    build:
      context: ./Rest/empleados-rest/empleados-rest
      dockerfile: Dockerfile

    container_name: empleados-rest

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - empleados-network


  graphql-api:
    build:
      context: ./Graphql/empleados-graphql/empleados-graphql
      dockerfile: Dockerfile

    container_name: empleados-graphql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - empleados-network


  grpc-api:
    build:
      context: ./Grpc/empleados-grpc/empleados-grpc
      dockerfile: Dockerfile

    container_name: empleados-grpc

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GRPC_SERVER_PORT: 9090

    ports:
      - "9090:9090"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - empleados-network


volumes:

  empleados_mysql_data:


networks:

  empleados-network:
    driver: bridge